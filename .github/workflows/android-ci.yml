name: VibeCut Pro Android Build & Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Core Engine & App Unit Tests
        run: ./gradlew :core:engine:test testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload VibeCut Pro Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeCutPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
