name: VibeCut Pro Android Build & Tests

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Assemble Debug APK
        run: |
          set +e
          ./gradlew :core:engine:test testDebugUnitTest assembleDebug --stacktrace > /tmp/gradle-build.log 2>&1
          STATUS=$?
          cat /tmp/gradle-build.log
          if [ $STATUS -ne 0 ]; then
            grep -E "^e: |FAILURE:|What went wrong:|^\* |^  > |error: |Execution failed" /tmp/gradle-build.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $STATUS
          fi

      - name: Upload VibeCut Pro Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeCutPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
